[project]
name = "test-bank-aqa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = "-v -s"
pythonpath=['.', 'src']
importmode = "importlib"
markers = [
    "api: API Test",
    "AUTH: Authorization Test"
]